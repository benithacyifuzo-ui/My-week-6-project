<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <h1>My Profile</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#skills">Skills</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main>
        <section id="home">
            <img id="profile-image" src="/images/benitha.jpg" alt="Profile photo">
            <p>Hello! Welcome to my portfolio.</p>
        </section>

        <section id="skills">
            <h2>My Skills</h2>
            <ul id="skills-list"></ul>
        </section>

        <section id="contact">
            <h2>Contact</h2>
            <p>Thank you for visiting my portfolio.</p>
        </section>
    </main>

    <footer>
        <p id="last-updated"></p>
    </footer>
</body>

</html>
